name: Apply smart lesson AI context

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update lesson AI context
        run: |
          python -c "from pathlib import Path; p=Path('AI_Language_App_flutter/ai_app_flutter_backend/backend/routers/lesson_stage_ai.py'); s=p.read_text(); s=s.replace('# Maximum amount of recent history actually sent to the AI.\n# Keeping this smaller reduces prompt size while preserving\n# enough recent context for natural conversation.\nMAX_CONTEXT_MESSAGES = 8\n', '# Keep only the minimum recent history needed by each stage.\n# Teaching needs one previous exchange; Practice keeps two.\nMAX_TEACHING_CONTEXT_MESSAGES = 2\nMAX_PRACTICE_CONTEXT_MESSAGES = 4\n', 1); s=s.replace('def _history_messages(\n    history,\n) -> list[dict[str, str]]:', 'def _history_messages(\n    history,\n    max_messages: int,\n) -> list[dict[str, str]]:', 1); s=s.replace('for item in history[-MAX_CONTEXT_MESSAGES:]:', 'for item in history[-max_messages:]:', 1); s=s.replace('''        messages = _history_messages(\n            history\n        )''', '''        context_message_limit = (\n            MAX_TEACHING_CONTEXT_MESSAGES\n            if request.stage == \"teaching\"\n            else MAX_PRACTICE_CONTEXT_MESSAGES\n        )\n\n        messages = _history_messages(\n            history,\n            context_message_limit,\n        )''', 1); s=s.replace('Only the latest MAX_CONTEXT_MESSAGES are sent to the AI\n    to reduce prompt size and cost.', 'Only the latest stage-specific messages are sent to the AI.\n    Teaching uses one previous exchange; Practice uses two.', 1); p.write_text(s)"

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_Language_App_flutter/ai_app_flutter_backend/backend/routers/lesson_stage_ai.py
          git diff --cached --quiet && exit 0
          git commit -m "Reduce lesson AI history context"
          git push
