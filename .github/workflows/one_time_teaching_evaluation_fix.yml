name: One-time teaching evaluation fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply teaching evaluation architecture
        shell: python
        run: |
          from pathlib import Path

          path = Path("AI_Language_App_flutter/ai_app_flutter_backend/backend/routers/lesson_stage_ai.py")
          text = path.read_text(encoding="utf-8")

          old_prompt = '''    return f"""
You are the **TEACHING AI** for a {lesson.level} language lesson.

Teach the **CURRENT TARGET** through a short teacher-learner exchange. You are the teacher, not the practice partner.

{_prompt_context(lesson=lesson, targets=targets)}

{current_target_text}

**RULES**:
- Focus on the current target and its **SUCCESS CRITERIA**.
- **TARGET PATTERNS** guide teaching; they are not exact required sentences.
- Respond to what the learner actually says and let them attempt; never answer for them.
- Keep explanations brief and level-appropriate; prefer short examples/prompts.
- If incorrect or incomplete, give the smallest useful correction/model and ask for another attempt.
- Do not move on until the success criteria are clearly met.
- Accept natural alternatives that satisfy the criteria.
- Answer useful target questions briefly, then return to practice.
- Handle unrelated replies naturally and guide back to the target.
- Keep normal responses to 2-3 short sentences.

{task}

**COMPLETION**:
Only when the learner clearly meets the success criteria, give brief positive feedback and append:
[[TARGET_COMPLETE:{current_target_order}]]

The marker must be last and never be shown or explained.
""".strip()
'''

          new_prompt = '''    return f"""
You are the **TEACHING AI** for a {lesson.level} language lesson.

Teach the **CURRENT TARGET** through a short teacher-learner exchange. You are the teacher, not the practice partner.

{_prompt_context(lesson=lesson, targets=targets)}

{current_target_text}

**RULES**:
- Focus on the current target and its **SUCCESS CRITERIA**.
- **TARGET PATTERNS** guide teaching; they are not exact required sentences.
- Evaluate the learner's latest answer against the **SUCCESS CRITERIA** before deciding whether the target is complete.
- A target is complete only when the learner's latest answer clearly satisfies the success criteria. Do not mark it complete merely because the answer is understandable or close.
- Respond to what the learner actually says and let them attempt; never answer for them.
- Keep explanations brief and level-appropriate; prefer short examples/prompts.
- If incorrect or incomplete, give the smallest useful correction/model and ask for another attempt.
- Do not move on until the success criteria are clearly met.
- Accept natural alternatives that satisfy the criteria.
- Answer useful target questions briefly, then return to practice.
- Handle unrelated replies naturally and guide back to the target.
- Keep normal responses to 2-3 short sentences.

{task}

**OUTPUT FORMAT — MANDATORY JSON**:
Return ONLY one valid JSON object with exactly these fields:
{{
  "reply": "the short learner-facing response",
  "target_completed": true,
  "target_order": {current_target_order},
  "stage_completed": false
}}

- **reply** must contain only the learner-facing message. Never put JSON, metadata, markers, or evaluation text inside it.
- **target_completed** must be true only if the learner's latest answer clearly satisfies the current target's success criteria; otherwise false.
- **target_order** must be the current target order when evaluating a target, and null when there is no current target.
- **stage_completed** must be true only when this completed target causes all required teaching targets to be complete; otherwise false.
- When the learner is incorrect or incomplete, set **target_completed** to false and keep **target_order** equal to the current target order.
- The backend, not the model, controls lesson state. Never assume that merely writing true changes the lesson state.
""".strip()
'''

          if old_prompt not in text:
              raise SystemExit("Expected teaching prompt block was not found; aborting without changes.")
          text = text.replace(old_prompt, new_prompt, 1)

          old_marker_section = '''# ============================================================
# AI RESPONSE / MARKERS
# ============================================================
def _extract_target_completion(
    reply: str,
) -> tuple[str, int | None, bool]:
    target_match = TARGET_COMPLETE_PATTERN.search(
        reply
    )
    teaching_complete = bool(
        TEACHING_COMPLETE_PATTERN.search(
            reply
        )
    )
    target_order: int | None = None
    if target_match:
        try:
            target_order = int(
                target_match.group(1)
            )
        except ValueError:
            target_order = None
    clean_reply = _remove_control_markers(
        reply
    )
    return (
        clean_reply,
        target_order,
        teaching_complete,
    )
'''

          new_marker_section = '''# ============================================================
# AI RESPONSE / MARKERS
# ============================================================
def _extract_target_completion(
    reply: str,
) -> tuple[str, int | None, bool]:
    target_match = TARGET_COMPLETE_PATTERN.search(
        reply
    )
    teaching_complete = bool(
        TEACHING_COMPLETE_PATTERN.search(
            reply
        )
    )
    target_order: int | None = None
    if target_match:
        try:
            target_order = int(
                target_match.group(1)
            )
        except ValueError:
            target_order = None
    clean_reply = _remove_control_markers(
        reply
    )
    return (
        clean_reply,
        target_order,
        teaching_complete,
    )


def _parse_teaching_evaluation(
    raw_reply: str,
    *,
    current_target_order: int | None,
    is_control_message: bool,
) -> tuple[str, bool, int | None, bool]:
    """Parse the Teaching AI's structured evaluation.

    The model evaluates the learner, but the backend remains the authority
    that validates the target order and persists completion state. A legacy
    marker response is still accepted for backward compatibility.
    """
    try:
        payload = json.loads(raw_reply)
    except (TypeError, ValueError, json.JSONDecodeError):
        reply, marker_target, teaching_complete = _extract_target_completion(
            raw_reply
        )
        valid_marker = (
            not is_control_message
            and marker_target is not None
            and current_target_order is not None
            and marker_target == current_target_order
        )
        return (
            reply,
            valid_marker,
            marker_target if valid_marker else None,
            teaching_complete if valid_marker else False,
        )

    if not isinstance(payload, dict):
        raise RuntimeError(
            "Teaching AI returned an invalid evaluation object."
        )

    reply = str(payload.get("reply") or "").strip()
    if not reply:
        raise RuntimeError(
            "Teaching AI evaluation did not contain a learner-facing reply."
        )

    target_completed = payload.get("target_completed") is True
    target_order_raw = payload.get("target_order")
    target_order: int | None = None
    if target_order_raw is not None:
        try:
            target_order = int(target_order_raw)
        except (TypeError, ValueError):
            target_order = None

    stage_completed = payload.get("stage_completed") is True

    valid_target_completion = (
        not is_control_message
        and target_completed
        and current_target_order is not None
        and target_order == current_target_order
    )

    return (
        reply,
        valid_target_completion,
        target_order if valid_target_completion else None,
        stage_completed if valid_target_completion else False,
    )
'''

          if old_marker_section not in text:
              raise SystemExit("Expected marker parser block was not found; aborting without changes.")
          text = text.replace(old_marker_section, new_marker_section, 1)

          old_generate = '''        response = provider.generate_text(
            model=AI_MODEL,
            prompt=messages,
            system_instruction=_system_prompt(
                stage=request.stage,
                lesson=lesson,
                targets=targets,
                scenario=scenario,
                current_target_order=current_target_order,
                is_start=is_control_message,
            ),
            max_output_tokens=MAX_OUTPUT_TOKENS,
        )
'''

          new_generate = '''        response = provider.generate_text(
            model=AI_MODEL,
            prompt=messages,
            system_instruction=_system_prompt(
                stage=request.stage,
                lesson=lesson,
                targets=targets,
                scenario=scenario,
                current_target_order=current_target_order,
                is_start=is_control_message,
            ),
            max_output_tokens=MAX_OUTPUT_TOKENS,
            response_mime_type=(
                "application/json"
                if request.stage == "teaching"
                else None
            ),
        )
'''

          if old_generate not in text:
              raise SystemExit("Expected provider call was not found; aborting without changes.")
          text = text.replace(old_generate, new_generate, 1)

          old_parse = '''        (
            reply,
            completed_target_order,
            teaching_complete_marker,
        ) = _extract_target_completion(
            raw_reply
        )
'''

          new_parse = '''        if request.stage == "teaching":
            (
                reply,
                valid_target_completion,
                completed_target_order,
                teaching_complete_marker,
            ) = _parse_teaching_evaluation(
                raw_reply,
                current_target_order=current_target_order,
                is_control_message=is_control_message,
            )
        else:
            (
                reply,
                completed_target_order,
                teaching_complete_marker,
            ) = _extract_target_completion(
                raw_reply
            )
            valid_target_completion = False
'''

          if old_parse not in text:
              raise SystemExit("Expected response parser call was not found; aborting without changes.")
          text = text.replace(old_parse, new_parse, 1)

          old_validation = '''        valid_target_completion = False
        if (
            request.stage == "teaching"
            and completed_target_order is not None
            and current_target_order is not None
            and completed_target_order
            == current_target_order
            and not is_control_message
        ):
            valid_target_completion = True
'''

          if old_validation not in text:
              raise SystemExit("Expected marker validation block was not found; aborting without changes.")
          text = text.replace(old_validation, "", 1)

          path.write_text(text, encoding="utf-8")

      - name: Validate backend syntax
        run: |
          python -m py_compile AI_Language_App_flutter/ai_app_flutter_backend/backend/routers/lesson_stage_ai.py
          python -m py_compile AI_Language_App_flutter/ai_app_flutter_backend/backend/services/ai/provider.py

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_Language_App_flutter/ai_app_flutter_backend/backend/routers/lesson_stage_ai.py
          git rm .github/workflows/one_time_teaching_evaluation_fix.yml
          git commit -m "Make teaching target evaluation backend-driven"
          git push
