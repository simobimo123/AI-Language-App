name: One-time teaching evaluation fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply migration
        run: python .github/scripts/apply_teaching_evaluation_fix.py

      - name: Validate backend syntax
        run: |
          python -m py_compile AI_Language_App_flutter/ai_app_flutter_backend/backend/routers/lesson_stage_ai.py
          python -m py_compile AI_Language_App_flutter/ai_app_flutter_backend/backend/services/ai/provider.py

      - name: Remove migration files and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_Language_App_flutter/ai_app_flutter_backend/backend/routers/lesson_stage_ai.py
          git rm .github/workflows/one_time_teaching_evaluation_fix.yml .github/scripts/apply_teaching_evaluation_fix.py
          git commit -m "Make teaching target evaluation backend-driven"
          git push
