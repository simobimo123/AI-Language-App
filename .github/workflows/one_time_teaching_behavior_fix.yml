name: One-time Teaching AI behavior fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Teaching AI prompt and language lock
        shell: python
        run: |
          from pathlib import Path

          path = Path("AI_Language_App_flutter/ai_app_flutter_backend/backend/routers/lesson_stage_ai.py")
          text = path.read_text(encoding="utf-8")

          start = text.index("def _teaching_system_prompt(")
          end = text.index("\n\n# ============================================================\n# PRACTICE AI", start)

          new_function = '''def _teaching_system_prompt(
    *,
    lesson: CourseLesson,
    targets: list[dict],
    current_target_order: int | None,
    is_start: bool,
) -> str:
    current_target = _target_by_order(targets, current_target_order)

    if current_target is None:
        current_target_text = "**CURRENT TARGET**: There is no remaining target."
    else:
        goal = str(current_target.get("goal", "")).strip()
        patterns = [
            str(item).strip()
            for item in current_target.get("patterns", [])
            if str(item).strip()
        ]
        success_criteria = str(
            current_target.get("success_criteria", "")
        ).strip()
        current_target_text = f"**CURRENT TARGET**: {goal}"
        if patterns:
            current_target_text += (
                f"\\n**TARGET PATTERNS**: {' | '.join(patterns)}"
            )
        if success_criteria:
            current_target_text += (
                f"\\n**SUCCESS CRITERIA**: {success_criteria}"
            )

    next_target = None
    if current_target_order is not None:
        required_orders = [
            int(target["order"])
            for target in targets
            if target["required"] and target.get("order") is not None
        ]
        for order in required_orders:
            if order > int(current_target_order):
                next_target = _target_by_order(targets, order)
                break

    if next_target is None:
        next_target_text = "**NEXT TARGET**: None; this is the final required target."
    else:
        next_goal = str(next_target.get("goal", "")).strip()
        next_patterns = [
            str(item).strip()
            for item in next_target.get("patterns", [])
            if str(item).strip()
        ]
        next_target_text = (
            f"**NEXT TARGET**: {next_target.get('order')} — {next_goal}"
        )
        if next_patterns:
            next_target_text += (
                f"\\n**NEXT TARGET PATTERNS**: {' | '.join(next_patterns)}"
            )

    task = (
        "**START**: Briefly introduce the target, then ask the learner to produce it."
        if is_start
        else "**RESPONSE**: Judge the learner's latest answer against the target and success criteria. "
             "If not met, stay on the same target. For meaningful errors, briefly correct/model "
             "and ask for another attempt. If it is met, do NOT ask the learner to repeat the same target; "
             "give brief positive feedback and move directly to the next target."
    )

    return f"""
You are the **TEACHING AI** for a {lesson.level} language lesson.

Teach the **CURRENT TARGET** through a short teacher-learner exchange. You are the teacher, not the practice partner.

{_prompt_context(lesson=lesson, targets=targets)}

{current_target_text}

{next_target_text}

**TARGET PROGRESS RULE**:
- Evaluate ONLY the learner's latest answer for the **CURRENT TARGET**.
- If the latest answer clearly satisfies the **SUCCESS CRITERIA**, set `target_completed` to true.
- If it does not satisfy the criteria, set `target_completed` to false and stay on the current target.
- When `target_completed` is true, NEVER ask for another attempt at the completed target and NEVER repeat the completed target as practice.
- When `target_completed` is true and a next target exists, the learner-facing reply must briefly acknowledge success and immediately give ONE simple prompt for the **NEXT TARGET**.
- When `target_completed` is false, the learner-facing reply must remain focused on the current target and ask for another attempt when appropriate.
- Do not complete a target merely because the answer is understandable or close. Follow the success criteria exactly.
- Accept natural alternatives only when they genuinely satisfy the success criteria.

**LANGUAGE RULES**:
- The learner is learning the lesson **LANGUAGE** shown above.
- The selected explanation language is supplied separately by the backend and is authoritative.
- ALL teacher explanations, corrections, grammar notes, meanings, instructions, feedback, praise, transitions, and ordinary conversational prose in `reply` MUST use the selected explanation language.
- Do NOT use the learning language for teacher prose just because it is the language being learned.
- The learning language may appear in `reply` ONLY when it is the actual target sentence, example sentence, model answer, or learner practice content that must be produced in the learning language.
- Never write teacher feedback such as a learning-language equivalent of "very good", "now", "try again", or "correct" unless that language is also the selected explanation language.
- If the selected explanation language is Arabic, teacher prose must be Arabic; German target sentences may remain German when they are the learning content.
- If the selected explanation language is the same as the learning language, all of the reply may naturally be in the learning language.

**GENERAL RULES**:
- Focus on the current target and its **SUCCESS CRITERIA**.
- Respond to what the learner actually says; never answer for them.
- Keep explanations brief and level-appropriate.
- If incorrect or incomplete, give the smallest useful correction/model and ask for another attempt.
- Ask only ONE simple question or prompt per message.
- Handle unrelated replies naturally, then guide back to the current target.
- Keep normal responses to 1-2 short sentences unless a correction genuinely needs more.

{task}

**OUTPUT FORMAT — MANDATORY JSON**:
Return ONLY one valid JSON object with exactly these fields:
{{
  "reply": "the short learner-facing response",
  "target_completed": false,
  "target_order": {current_target_order},
  "stage_completed": false
}}

- `reply` contains ONLY the learner-facing message. Never put JSON, metadata, evaluation, markers, or field names inside it.
- `target_completed` is true ONLY when the latest learner answer clearly satisfies the current target's success criteria.
- `target_order` is the current target order while evaluating a target, and null when there is no current target.
- `stage_completed` is true ONLY when the current target is completed AND it is the final required target.
- When a target is completed and a next target exists, set `stage_completed` to false.
- The backend controls lesson state; the model only reports the evaluation.
""".strip()
'''

          text = text[:start] + new_function + text[end:]
          path.write_text(text, encoding="utf-8")

          provider = Path("AI_Language_App_flutter/ai_app_flutter_backend/backend/services/ai/provider.py")
          ptext = provider.read_text(encoding="utf-8")

          old = '''            "**LANGUAGE ROLES — MANDATORY**:\\n\\n"
            f"The learner is learning **{learning_language_name}** "
            f"(language code: **{learning_language}**). "
            f"Your explanation language is **{explanation_language}** "
            f"(language code: **{explanation_language_code}**).\\n\\n"
            f"The learner's goal is to learn **{learning_language_name}**. "
            f"You MUST use **{explanation_language}** for all explanations, "
            "corrections, grammar notes, word meanings, error explanations, "
            "instructions, and teacher feedback. The selected explanation "
            f"language comes from {language_source}.\\n\\n"
            f"Use **{learning_language_name}** for target sentences, example "
            "sentences, model answers, and language the learner is expected "
            "to produce or practice. These are learning-language content, "
            "not explanations.\\n\\n"
            f"When correcting an answer, explain the correction in "
            f"**{explanation_language}**, while keeping the corrected/model "
            f"sentence itself in **{learning_language_name}**.\\n\\n"
            f"Do NOT use **{learning_language_name}** for an explanation just "
            "because it is the language being learned. Do NOT silently switch "
            "the explanation language to English unless English is the selected "
            "explanation language."
'''

          new = '''            "**LANGUAGE ROLES — ABSOLUTE AND MANDATORY**:\\n\\n"
            f"The learner is learning **{learning_language_name}** "
            f"(language code: **{learning_language}**). "
            f"The selected explanation language is **{explanation_language}** "
            f"(language code: **{explanation_language_code}**).\\n\\n"
            f"The learner's goal is to learn **{learning_language_name}**. "
            f"ALL teacher prose MUST be written in **{explanation_language}**: "
            "explanations, corrections, grammar notes, meanings, error explanations, "
            "instructions, praise, transitions, encouragement, and feedback. "
            f"The selected explanation language comes from {language_source}.\\n\\n"
            f"**CRITICAL REPLY RULE**: In the `reply` field, every ordinary teacher word "
            f"MUST be in **{explanation_language}**. Do NOT write teacher phrases such as "
            f"a learning-language version of 'very good', 'now', 'try again', or 'correct' "
            f"in **{learning_language_name}** unless **{learning_language_name}** is also the "
            "selected explanation language.\\n\\n"
            f"Use **{learning_language_name}** in `reply` ONLY for target sentences, example "
            "sentences, model answers, or other language the learner is explicitly expected "
            "to produce/practice. Those are learning-language content, not teacher prose.\\n\\n"
            f"When correcting an answer, explain the correction in **{explanation_language}**, "
            f"while keeping the corrected/model sentence itself in **{learning_language_name}**.\\n\\n"
            f"Never silently switch the explanation language to English or the learning language. "
            f"The selected explanation language is **{explanation_language}** and must remain fixed "
            "for the entire Teaching AI response."
'''

          if old not in ptext:
              raise SystemExit("Expected provider language block not found; aborting.")
          provider.write_text(ptext.replace(old, new, 1), encoding="utf-8")

      - name: Validate syntax
        run: |
          python -m py_compile AI_Language_App_flutter/ai_app_flutter_backend/backend/routers/lesson_stage_ai.py
          python -m py_compile AI_Language_App_flutter/ai_app_flutter_backend/backend/services/ai/provider.py

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_Language_App_flutter/ai_app_flutter_backend/backend/routers/lesson_stage_ai.py AI_Language_App_flutter/ai_app_flutter_backend/backend/services/ai/provider.py
          git rm .github/workflows/one_time_teaching_behavior_fix.yml
          git commit -m "Stabilize teaching target progression and explanation language"
          git push
