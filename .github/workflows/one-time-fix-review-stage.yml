name: One-time review stage fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-review-stage.yml'

permissions:
  contents: write

jobs:
  fix-review-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Allow reopening completed Teaching stage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('AI_Language_App_flutter/ai_app_flutter_backend/backend/routers/lesson_stage_ai.py')
          text = path.read_text(encoding='utf-8')

          old = '''    if current == "completed":
        raise HTTPException(
            status_code=status.HTTP_409_CONFLICT,
            detail=f"Stage '{stage}' is already completed.",
        )
'''

          new = '''    # A completed stage may be opened again for review.
          # Only locked stages remain blocked here. Reopening Teaching creates
          # a fresh conversation while preserving the completed lesson state.
'''

          if old not in text:
              raise SystemExit('Expected completed-stage guard was not found.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-fix-review-stage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_Language_App_flutter/ai_app_flutter_backend/backend/routers/lesson_stage_ai.py .github/workflows/one-time-fix-review-stage.yml
          git diff --cached --quiet && exit 0
          git commit -m "Allow reviewing completed Teaching stage"
          git push origin main
